[build]
  publish = "."

# Proxy the API and TanStack Start server-function endpoints to the
# upstream deploy that hosts the live back-end and database.
# Status 200 = transparent proxy (the user's URL bar stays on this site).

# /api/paypal-vote-claim is handled locally by a Netlify Function because
# the upstream deploy does not implement it. The function credits the
# purchased votes by calling the upstream /api/vote endpoint. This
# redirect must appear BEFORE the generic /api/* proxy so it takes
# precedence.
[[redirects]]
  from = "/api/paypal-vote-claim"
  to = "/.netlify/functions/paypal-vote-claim"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://69f54b337755e5d176e2cef9--thenextfilmlead.netlify.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/_serverFn/*"
  to = "https://69f54b337755e5d176e2cef9--thenextfilmlead.netlify.app/_serverFn/:splat"
  status = 200
  force = true

# The post-login Admin button and the vote page link to /old-project/vote.html
# (and its sibling /old-project/style.css, /old-project/app.js,
# /old-project/identity-bundle.js). Proxy them to the same upstream so the
# admin dashboard and the vote page render with their data and credentials.
[[redirects]]
  from = "/old-project/*"
  to = "https://69f54b337755e5d176e2cef9--thenextfilmlead.netlify.app/old-project/:splat"
  status = 200
  force = true

# /contestant-details.html is served from the local file in the repo so
# the page can register paid votes the moment a tier is selected. The
# other admin/legacy redirects above still apply.
